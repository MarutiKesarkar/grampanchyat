<!-- Stats Section -->
<div class="position-relative d-flex flex-column w-100 bg-white border-bottom" style="border-color:#f0f2f4;">
  <div class="px-4 px-md-5 d-flex flex-fill justify-content-center py-4">
    <div class="d-flex flex-column flex-fill" style="max-width: 960px;">
      <div class="d-flex flex-wrap gap-3">

        <!-- Population -->
        <div class="d-flex flex-column flex-fill align-items-center text-center rounded-3 p-4 stat-card">

          <div class="stat-img-box mb-1">
            <img src="population.png" alt="population image" />
          </div>
          <p class="text-dark mb-1 fw-medium">लोकसंख्या</p>
          <p class="text-dark fs-2 fw-bold mb-0">१५,०००+</p>
        </div>

        <!-- Area -->
        <div class="d-flex flex-column flex-fill align-items-center text-center rounded-3 p-4 stat-card">

          <div class="stat-img-box mb-1">
            <img src="area.png" alt="area image" />
          </div>
          <p class="text-dark mb-1 fw-medium">क्षेत्रफळ</p>
          <p class="text-dark fs-2 fw-bold mb-0">२५ चौ.किमी</p>
        </div>

        <!-- Households -->
        <div class="d-flex flex-column flex-fill align-items-center text-center rounded-3 p-4 stat-card">

         <div class="stat-img-box mb-1">
            <img src="hospital.png" alt="hospital image" />
          </div>
          <p class="text-dark mb-1 fw-medium">आरोग्य केंद्र</p>
          <p class="text-dark fs-2 fw-bold mb-0">१</p>
        </div>

         <div class="d-flex flex-column flex-fill align-items-center text-center rounded-3 p-4 stat-card">

          <div class="stat-img-box mb-1">
            <img src="schools.png" alt="school image" />
          </div>
          <p class="text-dark mb-1 fw-medium">शाळा</p>
          <p class="text-dark fs-2 fw-bold mb-0">१०+</p>
        </div>

        <div class="d-flex flex-column flex-fill align-items-center text-center rounded-3 p-4 stat-card">

          <div class="stat-img-box mb-1">
            <img src="clinics.png" alt="clinic image" />
          </div>
          <p class="text-dark mb-1 fw-medium">दवाखाने</p>
          <p class="text-dark fs-2 fw-bold mb-0">१०+</p>
        </div>

      </div>
    </div>
  </div>
</div>
